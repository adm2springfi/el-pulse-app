<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>EL Pulse - Public Events</title>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
      <h1 class="text-3xl font-bold text-indigo-400">Upcoming Events</h1>
      <a href="/index.html" class="text-sm text-gray-400 hover:text-white">← Home</a>
    </div>

    <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </div>

  <script>
    async function loadEvents() {
      const res = await fetch('/api/events');
      const data = await res.json();
      const grid = document.getElementById('eventsGrid');
      
      if (!data.events || data.events.length === 0) {
        grid.innerHTML = '<p class="col-span-3 text-center text-gray-400 py-12">No upcoming events listed yet. Check back soon!</p>';
        return;
      }

      grid.innerHTML = data.events.map(e => `
        <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg flex flex-col justify-between">
          <img src="${e.imageUrl}" class="h-48 w-full object-cover" alt="${e.title}">
          <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h3 class="font-bold text-xl text-indigo-300">${e.title}</h3>
              <p class="text-xs text-gray-400">Organizer: ${e.organizer?.name || 'EL Pulse Planner'}</p>
              <p class="text-sm text-gray-300 mt-2">${e.description || 'No description provided.'}</p>
            </div>
            <div>
              <div class="flex justify-between items-center font-semibold mb-4 text-sm text-gray-300">
                <span>📍 ${e.location}</span>
                <span class="text-green-400 text-base font-bold">R${e.price.toFixed(2)}</span>
              </div>
              <button onclick="checkout('${e.id}')" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2 rounded text-center block">Buy Ticket (PayFast)</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function checkout(eventId) {
      const res = await fetch('/api/tickets/checkout-split', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventId, quantity: 1 })
      });
      const data = await res.json();
      if (data.success && data.checkoutUrl) {
        // Redirect to PayFast Split Checkout
        alert(`Proceeding to PayFast Split Checkout.\nTotal: R${data.breakdown.total}\nOrganizer gets 95% (R${data.breakdown.organizerPayout95Percent})\nPlatform Fee 5% (R${data.breakdown.platformFee5Percent})`);
      } else {
        alert(data.message || 'Checkout failed');
      }
    }

    loadEvents();
  </script>
</body>
</html>
