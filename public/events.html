<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL Pulse - Events Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="events.html">EL Pulse Events</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="events.html">Browse Events</a>
        <a class="nav-link" href="buy.html">Direct Buy</a>
        <a class="nav-link" href="organizer.html">+ Post Your Event</a>
        <a class="nav-link" href="scan.html">Door Scanner</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="p-5 mb-4 bg-primary text-white rounded-3 shadow">
      <div class="container-fluid py-3 text-center">
        <h1 class="display-5 fw-bold">Discover & Attend East London Events</h1>
        <p class="col-md-8 fs-4 mx-auto">Find the best local concerts, markets, and nightlife across East London.</p>
      </div>
    </div>

    <div class="row" id="eventsList">
      <!-- Events dynamically injected here -->
    </div>
  </div>

  <script>
    async function loadEvents() {
      try {
        const res = await fetch('/api/events');
        const events = await res.json();
        const container = document.getElementById('eventsList');
        container.innerHTML = '';

        if (events.length === 0) {
          container.innerHTML = '<p class="text-center text-muted">No events available right now.</p>';
          return;
        }

        events.forEach(event => {
          const card = document.createElement('div');
          card.className = 'col-md-4 mb-4';
          card.innerHTML = `
            <div class="card h-100 shadow-sm">
              <img src="${event.imageUrl || 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=600&auto=format&fit=crop&q=80'}" class="card-img-top" alt="Event Image" style="height: 200px; object-fit: cover;">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${event.title}</h5>
                <p class="card-text text-muted mb-1"><small>Location: ${event.venue || event.location}</small></p>
                <p class="card-text text-muted mb-3"><small>Date: ${new Date(event.date).toLocaleString()} | Category: ${event.category || event.description}</small></p>
                <h6 class="text-primary fw-bold mt-auto">R${event.price}</h6>
                <a href="buy.html?eventId=${event.id}" class="btn btn-primary mt-3">Get Tickets</a>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Failed to load events:', err);
      }
    }
    loadEvents();
  </script>
</body>
</html>
