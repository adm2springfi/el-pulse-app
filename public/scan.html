<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL Pulse - Door Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="events.html">EL Pulse Events</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="events.html">Browse Events</a>
        <a class="nav-link" href="buy.html">Direct Buy</a>
        <a class="nav-link" href="organizer.html">Post Event</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4 text-center">
          <h2 class="mb-3">Door Ticket Scanner</h2>
          <p class="text-muted">Enter or scan ticket QR code string to verify entry.</p>
          
          <div class="mb-3">
            <input type="text" id="qrCodeInput" class="form-control text-center" placeholder="Enter Ticket Code (e.g. TICKET-...)">
          </div>
          <button id="verifyBtn" class="btn btn-success w-100">Verify Ticket</button>

          <div id="resultContainer" class="mt-4"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const code = document.getElementById('qrCodeInput').value.trim();
      const resultDiv = document.getElementById('resultContainer');
      
      if (!code) {
        resultDiv.innerHTML = `<div class="alert alert-warning">Please enter a ticket code.</div>`;
        return;
      }

      try {
        const res = await fetch(`/api/tickets/verify/${code}`);
        const data = await res.json();

        if (res.ok && data.valid) {
          resultDiv.innerHTML = `
            <div class="alert alert-success">
              <h4>✅ VALID TICKET</h4>
              <p><strong>Event:</strong> ${data.ticket.event.title}</p>
              <p><strong>User:</strong> ${data.ticket.userId}</p>
            </div>`;
        } else {
          resultDiv.innerHTML = `
            <div class="alert alert-danger">
              <h4>❌ INVALID TICKET</h4>
              <p>${data.message || 'Ticket not found or already used.'}</p>
            </div>`;
        }
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<div class="alert alert-danger">Verification error occurred.</div>`;
      }
    });
  </script>
</body>
</html>
