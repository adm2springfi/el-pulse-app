<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>EL Pulse - Organizer Dashboard</title>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen">

  <!-- Navigation Bar -->
  <nav class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-md fixed w-full top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="/index.html" class="text-xl font-black text-indigo-500 tracking-wider">EL PULSE <span class="text-xs text-gray-400 font-normal">Organizer Portal</span></a>
      
      <div class="flex items-center space-x-4">
        <a href="/index.html" class="text-sm text-gray-300 hover:text-white transition">← Home</a>
        <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-700/50 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-6 pt-32 pb-24 space-y-8">
    
    <!-- Welcome Header & Apps -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-900 p-6 rounded-2xl border border-gray-800">
      <div>
        <h1 class="text-3xl font-black text-white" id="welcomeUser">Welcome, Organizer</h1>
        <p class="text-gray-400 text-sm mt-1">Manage live events, door entry scans, and photo galleries.</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <a href="/scanner.html" class="inline-flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-lg">
          <i class="fa-solid fa-qrcode"></i>
          <span>Door Scanner</span>
        </a>
        <a href="/gallery.html" target="_blank" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-lg">
          <i class="fa-solid fa-images"></i>
          <span>View Gallery</span>
        </a>
      </div>
    </div>

    <!-- Create Event Form -->
    <div class="bg-gray-900 p-8 rounded-2xl shadow-xl border border-gray-800">
      <h2 class="text-xl font-bold mb-6 text-indigo-400 flex items-center space-x-2">
        <i class="fa-solid fa-circle-plus"></i>
        <span>Publish New Event</span>
      </h2>

      <form id="createEventForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm text-gray-300 mb-1">Event Title</label>
            <input type="text" id="title" required placeholder="e.g. Beachfront Amapiano Fest" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white">
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Location / Venue</label>
            <input type="text" id="location" required placeholder="e.g. Nahoon Beach, East London" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div>
            <label class="block text-sm text-gray-300 mb-1">Event Date & Time</label>
            <div class="flex space-x-2">
              <input type="datetime-local" id="eventDate" required class="flex-1 bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white text-sm">
              <button type="button" onclick="confirmDateTime()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 rounded-xl text-xs transition whitespace-nowrap shadow-md">
                <i class="fa-solid fa-check me-1"></i>Apply
              </button>
            </div>
            <p id="dateStatus" class="text-[11px] text-emerald-400 mt-1 hidden font-medium">✓ Date & time locked in!</p>
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Ticket Price (ZAR - R)</label>
            <input type="number" id="price" step="0.01" required placeholder="150.00" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white">
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Total Capacity</label>
            <input type="number" id="capacity" required placeholder="250" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white">
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">Event Description</label>
          <textarea id="description" rows="3" placeholder="Describe the lineup, schedule, and activities..." class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white"></textarea>
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">Upload Event Banner Image (Poster / Flyer)</label>
          <input type="file" id="bannerImage" accept="image/*" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-xl text-white transition shadow-lg">
          Publish Event Live
        </button>
      </form>

      <div id="status" class="mt-4 text-center text-sm font-semibold p-3 rounded-lg hidden"></div>
    </div>

    <!-- Upload Gallery Photo Section -->
    <div class="bg-gray-900 p-8 rounded-2xl shadow-xl border border-gray-800">
      <h2 class="text-xl font-bold mb-6 text-indigo-400 flex items-center space-x-2">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Upload Event Picture to Gallery</span>
      </h2>

      <form id="uploadPhotoForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm text-gray-300 mb-1">Photo Title / Caption</label>
            <input type="text" id="photoTitle" required placeholder="e.g. Crowd vibe at Main Stage" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white">
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Link to Specific Event (Optional)</label>
            <select id="photoEventId" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-indigo-500 text-white text-sm">
              <option value="">-- General Gallery / All Events --</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">Select Image File</label>
          <input type="file" id="galleryPhotoFile" accept="image/*" required class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
        </div>

        <button type="submit" id="uploadPhotoBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl text-white transition shadow-lg">
          Upload Photo to Public Gallery
        </button>
      </form>

      <div id="photoStatus" class="mt-4 text-center text-sm font-semibold p-3 rounded-lg hidden"></div>
    </div>

    <!-- My Listed Events -->
    <div>
      <h2 class="text-2xl font-bold mb-6 text-indigo-400">My Listed Events</h2>
      <div id="myEventsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <p class="text-gray-500 col-span-full text-center py-8">Loading your events...</p>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('el_pulse_planner_token');
    if (!token) {
      window.location.href = '/planner-login.html';
    }

    const userName = localStorage.getItem('el_pulse_user_name');
    if (userName) {
      document.getElementById('welcomeUser').innerText = `Welcome, ${userName}`;
    }

    function logout() {
      localStorage.removeItem('el_pulse_planner_token');
      localStorage.removeItem('el_pulse_user_name');
      localStorage.removeItem('el_pulse_user_role');
      window.location.href = '/planner-login.html';
    }

    function confirmDateTime() {
      const val = document.getElementById('eventDate').value;
      const dateStatus = document.getElementById('dateStatus');
      if (!val) {
        alert("Please pick a valid date and time first.");
        return;
      }
      dateStatus.classList.remove('hidden');
      setTimeout(() => dateStatus.classList.add('hidden'), 4000);
    }

    async function loadMyEvents() {
      const grid = document.getElementById('myEventsGrid');
      const select = document.getElementById('photoEventId');
      
      try {
        const res = await fetch('/api/events/my-events', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.success && data.events) {
          // Populate event dropdown
          select.innerHTML = '<option value="">-- General Gallery / All Events --</option>';
          data.events.forEach(e => {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = e.title;
            select.appendChild(opt);
          });

          if (data.events.length === 0) {
            grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8 bg-gray-900 rounded-2xl border border-gray-800">No events created yet.</p>';
            return;
          }

          grid.innerHTML = data.events.map(e => {
            const dateStr = e.date ? new Date(e.date).toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short' }) : 'TBA';
            return `
              <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 flex flex-col">
                <img src="${e.imageUrl}" alt="${e.title}" class="h-40 w-full object-cover">
                <div class="p-5 flex-1 flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start mb-2">
                      <h3 class="text-lg font-bold text-white">${e.title}</h3>
                      <span class="bg-indigo-900/60 text-indigo-300 text-xs px-2.5 py-1 rounded-md border border-indigo-700/40">R${e.price.toFixed(2)}</span>
                    </div>
                    <p class="text-gray-400 text-xs mb-3 line-clamp-2">${e.description || 'No description.'}</p>
                    <div class="text-xs text-gray-400 space-y-1">
                      <p>📅 <strong class="text-indigo-300">${dateStr}</strong></p>
                      <p>📍 ${e.location}</p>
                      <p>🎟️ Tickets Available: ${e.available} / ${e.capacity}</p>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        grid.innerHTML = '<p class="text-red-400 col-span-full text-center py-8">Failed to load your events.</p>';
      }
    }

    document.getElementById('createEventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      status.classList.remove('hidden');
      status.innerText = "Publishing event...";
      status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-gray-800 text-gray-300";
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value.trim());
      formData.append('location', document.getElementById('location').value.trim());
      formData.append('eventDate', document.getElementById('eventDate').value);
      formData.append('price', document.getElementById('price').value);
      formData.append('capacity', document.getElementById('capacity').value);
      formData.append('description', document.getElementById('description').value.trim());
      
      const imageFile = document.getElementById('bannerImage').files[0];
      if (imageFile) {
        formData.append('bannerImage', imageFile);
      }

      try {
        const res = await fetch('/api/events/create', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        const data = await res.json();
        submitBtn.disabled = false;

        if (data.success) {
          status.innerText = "Event published successfully!";
          status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-green-950 text-green-300 border border-green-800";
          document.getElementById('createEventForm').reset();
          loadMyEvents();
          setTimeout(() => status.classList.add('hidden'), 3000);
        } else {
          status.innerText = data.message || "Failed to publish event.";
          status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-950 text-red-300 border border-red-800";
        }
      } catch (err) {
        submitBtn.disabled = false;
        status.innerText = "Connection error. Please try again.";
        status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-950 text-red-300 border border-red-800";
      }
    });

    document.getElementById('uploadPhotoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('photoStatus');
      const btn = document.getElementById('uploadPhotoBtn');

      status.classList.remove('hidden');
      status.innerText = "Uploading photo...";
      status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-gray-800 text-gray-300";
      btn.disabled = true;

      const formData = new FormData();
      formData.append('title', document.getElementById('photoTitle').value.trim());
      formData.append('eventId', document.getElementById('photoEventId').value);
      
      const file = document.getElementById('galleryPhotoFile').files[0];
      if (file) {
        formData.append('photo', file);
      }

      try {
        const res = await fetch('/api/gallery/upload', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        const data = await res.json();
        btn.disabled = false;

        if (data.success) {
          status.innerText = "Photo successfully added to public gallery!";
          status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-green-950 text-green-300 border border-green-800";
          document.getElementById('uploadPhotoForm').reset();
          setTimeout(() => status.classList.add('hidden'), 3000);
        } else {
          status.innerText = data.message || "Failed to upload photo.";
          status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-950 text-red-300 border border-red-800";
        }
      } catch (err) {
        btn.disabled = false;
        status.innerText = "Network error. Please try again.";
        status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-950 text-red-300 border border-red-800";
      }
    });

    loadMyEvents();
  </script>
</body>
</html>
