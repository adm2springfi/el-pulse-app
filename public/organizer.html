<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL Pulse - Organizer Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="events.html">EL Pulse Events</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="events.html">Browse Events</a>
        <a class="nav-link" href="buy.html">Direct Buy</a>
        <a class="nav-link" href="scan.html">Door Scanner</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm p-4">
          <h2 class="mb-4">Post a New Event</h2>
          <form id="eventForm">
            <div class="mb-3">
              <label for="title" class="form-label">Event Title</label>
              <input type="text" class="form-control" id="title" required placeholder="e.g. Beach Sunset Session">
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <input type="text" class="form-control" id="category" placeholder="e.g. Music, Nightlife">
            </div>
            <div class="mb-3">
              <label for="date" class="form-label">Date & Time</label>
              <input type="datetime-local" class="form-control" id="date" required>
            </div>
            <div class="mb-3">
              <label for="venue" class="form-label">Venue / Location</label>
              <input type="text" class="form-control" id="venue" required placeholder="e.g. Nahoon Beach, East London">
            </div>
            <div class="mb-3">
              <label for="price" class="form-label">Ticket Price (ZAR)</label>
              <input type="number" class="form-control" id="price" value="0" min="0">
            </div>
            <div class="mb-3">
              <label for="imageUrl" class="form-label">Event Banner Image URL</label>
              <input type="url" class="form-control" id="imageUrl" placeholder="https://example.com/image.jpg">
            </div>
            <button type="submit" class="btn btn-primary w-100">Publish Event</button>
          </form>
          <div id="message" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const venue = document.getElementById('venue').value;
      const price = document.getElementById('price').value;
      const imageUrl = document.getElementById('imageUrl').value;

      try {
        const response = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description: category, date, location: venue, price, imageUrl })
        });

        const data = await response.json();
        const msgDiv = document.getElementById('message');
        if (response.ok) {
          msgDiv.innerHTML = `<div class="alert alert-success">Event posted successfully! Redirecting...</div>`;
          setTimeout(() => window.location.href = 'events.html', 1500);
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('message').innerHTML = `<div class="alert alert-danger">Network error occurred.</div>`;
      }
    });
  </script>
</body>
</html>
