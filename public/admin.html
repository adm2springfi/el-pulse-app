<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>EL Pulse - Master Admin Portal</title>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-3xl font-black text-red-500 tracking-wider">SUPER ADMIN PORTAL</h1>
        <p class="text-xs text-gray-400 mt-1">Full control over all live events and platform listings</p>
      </div>
      <a href="/index.html" class="text-sm text-gray-400 hover:text-white">← Main Site</a>
    </div>

    <!-- Admin Login Card -->
    <div id="adminLoginCard" class="bg-gray-900 p-6 rounded-2xl border border-red-500/30 max-w-md mx-auto mb-8 shadow-2xl">
      <h2 class="text-xl font-bold mb-4 text-red-400">Admin Login</h2>
      <form id="adminLoginForm" class="space-y-4">
        <input type="email" id="adminEmail" placeholder="Admin Email" required class="w-full bg-gray-800 p-3 rounded-lg border border-gray-700">
        <input type="password" id="adminPass" placeholder="Admin Password" required class="w-full bg-gray-800 p-3 rounded-lg border border-gray-700">
        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-lg shadow-lg">Access Admin Portal</button>
      </form>
      <div id="loginMsg" class="mt-3 text-sm text-center font-semibold"></div>
    </div>

    <!-- Admin Dashboard (Hidden until Admin Login) -->
    <div id="adminDashboard" class="hidden space-y-8">
      <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-white">All Platform Events</h2>
          <button onclick="loadAllEvents()" class="bg-gray-800 hover:bg-gray-700 text-sm px-4 py-2 rounded-lg text-gray-300">🔄 Refresh List</button>
        </div>
        
        <div id="eventsContainer" class="space-y-4">
          <p class="text-gray-400 text-center py-8">Loading events...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let adminToken = localStorage.getItem('el_pulse_admin_token');
    if (adminToken) showAdminDashboard();

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: adminEmail.value, password: adminPass.value })
      });
      const data = await res.json();
      if (data.success && data.user.role === 'ADMIN') {
        adminToken = data.token;
        localStorage.setItem('el_pulse_admin_token', adminToken);
        showAdminDashboard();
      } else {
        loginMsg.innerText = data.user?.role !== 'ADMIN' ? "Access Denied: Account is not a Super Admin." : data.message;
        loginMsg.className = "text-red-400 mt-3 text-sm text-center font-semibold";
      }
    });

    function showAdminDashboard() {
      document.getElementById('adminLoginCard').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadAllEvents();
    }

    async function loadAllEvents() {
      const container = document.getElementById('eventsContainer');
      const res = await fetch('/api/events');
      const data = await res.json();

      if (!data.events || data.events.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center py-8">No events currently listed in the system.</p>';
        return;
      }

      container.innerHTML = data.events.map(e => `
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex flex-col md:flex-row gap-5 items-start md:items-center justify-between">
          <img src="${e.imageUrl}" class="w-24 h-24 object-cover rounded-lg bg-gray-900 flex-shrink-0" alt="${e.title}">
          
          <div class="flex-1 space-y-1">
            <h3 class="font-bold text-lg text-indigo-300">${e.title}</h3>
            <p class="text-xs text-gray-400">Organizer: ${e.organizer?.name || 'Unknown'} (${e.organizer?.email || 'N/A'})</p>
            <p class="text-xs text-gray-300">Price: <span class="text-green-400 font-bold">R${e.price.toFixed(2)}</span> | Cap: ${e.capacity} | Loc: ${e.location}</p>
          </div>

          <div class="flex gap-2 flex-wrap">
            <button onclick="editEvent('${e.id}', '${e.title.replace(/'/g, "\\'")}', '${e.price}', '${e.capacity}', '${e.location.replace(/'/g, "\\'")}')" 
                    class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm">
              ✏️ Edit
            </button>
            <button onclick="deleteEvent('${e.id}')" 
                    class="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2 rounded-lg text-sm">
              🗑️ Delete
            </button>
          </div>
        </div>
      `).join('');
    }

    async function deleteEvent(eventId) {
      if (!confirm("Are you sure you want to permanently delete this event?")) return;
      
      const res = await fetch(`/api/admin/events/${eventId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${adminToken}` }
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) loadAllEvents();
    }

    async function editEvent(id, currentTitle, currentPrice, currentCap, currentLoc) {
      const title = prompt("New Event Title:", currentTitle);
      if (title === null) return;
      const price = prompt("New Ticket Price (ZAR):", currentPrice);
      if (price === null) return;
      const capacity = prompt("New Capacity:", currentCap);
      if (capacity === null) return;
      const location = prompt("New Location:", currentLoc);
      if (location === null) return;

      const res = await fetch(`/api/admin/events/${id}`, {
        method: 'PUT',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${adminToken}` 
        },
        body: JSON.stringify({ title, price, capacity, location })
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) loadAllEvents();
    }
  </script>
</body>
</html>
