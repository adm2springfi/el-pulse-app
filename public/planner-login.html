<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Login - EL Pulse Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white">EL Pulse</h1>
            <p class="text-slate-400 text-sm mt-1">Event Organizer Portal Login</p>
        </div>

        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold uppercase text-slate-400">Password</label>
                    <button type="button" onclick="openResetModal()" class="text-xs text-indigo-400 hover:underline">Forgot password?</button>
                </div>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Don't have an organizer account? <a href="/planner-register.html" class="text-indigo-400 hover:underline font-semibold">Register here</a>
        </p>
    </div>

    <!-- Password Reset Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white">Reset Password</h3>
                <button onclick="closeResetModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="modal-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium"></div>

            <form onsubmit="handleResetPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Your Registered Email</label>
                    <input type="email" id="reset-email" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">New Password</label>
                    <input type="password" id="reset-new-password" required minlength="6" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition">
                    Update Password
                </button>
            </form>
        </div>
    </div>

    <script>
        function showAlert(msg, isError = true) {
            const box = document.getElementById('alert-box');
            box.className = `mb-6 p-4 rounded-xl text-sm font-medium ${isError ? 'bg-red-900/40 border border-red-500/50 text-red-200' : 'bg-emerald-900/40 border border-emerald-500/50 text-emerald-200'}`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        function showModalAlert(msg, isError = true) {
            const box = document.getElementById('modal-alert');
            box.className = `mb-4 p-3 rounded-xl text-xs font-medium ${isError ? 'bg-red-900/40 border border-red-500/50 text-red-200' : 'bg-emerald-900/40 border border-emerald-500/50 text-emerald-200'}`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        function openResetModal() {
            document.getElementById('reset-modal').classList.remove('hidden');
            document.getElementById('reset-modal').classList.add('flex');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
            document.getElementById('reset-modal').classList.remove('flex');
        }

        async function handleLogin(e) {
            e.preventDefault(); // Prevents page reload & question mark bug
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Ensures session cookie saves correctly
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Login failed');
                window.location.href = '/organizer.html';
            } catch (err) {
                showAlert(err.message, true);
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const newPassword = document.getElementById('reset-new-password').value;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Password reset failed');
                
                showModalAlert(data.message, false);
                setTimeout(() => {
                    closeResetModal();
                    showAlert('Password updated! You can now log in.', false);
                }, 1500);
            } catch (err) {
                showModalAlert(err.message, true);
            }
        }
    </script>
</body>
</html>
