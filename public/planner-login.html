<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Login - EL Pulse Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white">EL Pulse</h1>
            <p class="text-slate-400 text-sm mt-1">Event Organizer Portal Login</p>
        </div>

        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-bold uppercase text-slate-400">Password</label>
                    <button type="button" onclick="openResetModal()" class="text-xs text-indigo-400 hover:underline">Forgot password?</button>
                </div>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Don't have an organizer account? <a href="/planner-register.html" class="text-indigo-400 hover:underline font-semibold">Register here</a>
        </p>
    </div>

    <!-- Password Reset Modal -->
    <div id="reset-modal"
