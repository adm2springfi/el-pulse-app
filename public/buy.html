<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL Pulse - Direct Ticket Purchase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="events.html">EL Pulse Events</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="events.html">Browse Events</a>
        <a class="nav-link active" href="buy.html">Direct Buy</a>
        <a class="nav-link" href="organizer.html">Post Event</a>
        <a class="nav-link" href="scan.html">Door Scanner</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2 class="mb-4 text-center">Book Your Ticket</h2>
          <form id="buyForm">
            <div class="mb-3">
              <label for="eventSelect" class="form-label">Select Event</label>
              <select id="eventSelect" class="form-select" required>
                <option value="">-- Choose an Event --</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="userId" class="form-label">Your Name / Email</label>
              <input type="text" id="userId" class="form-control" placeholder="e.g. Leroy" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Complete Purchase & Generate Ticket</button>
          </form>
          <div id="ticketResult" class="mt-4"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function populateEvents() {
      try {
        const res = await fetch('/api/events');
        const events = await res.json();
        const select = document.getElementById('eventSelect');
        
        // Get eventId from URL parameters if present
        const urlParams = new URLSearchParams(window.location.search);
        const preselectedEventId = urlParams.get('eventId');

        events.forEach(ev => {
          const opt = document.createElement('option');
          opt.value = ev.id;
          opt.textContent = `${ev.title} - R${ev.price}`;
          if (ev.id === preselectedEventId) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Error loading events for purchase:', err);
      }
    }

    document.getElementById('buyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const eventId = document.getElementById('eventSelect').value;
      const userId = document.getElementById('userId').value;
      const resultDiv = document.getElementById('ticketResult');

      try {
        const res = await fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ eventId, userId })
        });

        const data = await res.json();
        if (res.ok) {
          resultDiv.innerHTML = `
            <div class="alert alert-success">
              <h4>🎉 Ticket Booked Successfully!</h4>
              <p><strong>Ticket Code:</strong> ${data.qrCode}</p>
              <p class="mb-0 text-muted"><small>You can use this code at the door scanner page.</small></p>
            </div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
        }
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<div class="alert alert-danger">Booking failed due to network error.</div>`;
      }
    });

    populateEvents();
  </script>
</body>
</html>
