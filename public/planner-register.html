<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <title>EL Pulse - Event Planner Registration</title>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6 font-sans">

  <div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-indigo-400">Organizer Registration</h2>
      <a href="/index.html" class="text-xs text-gray-400 hover:text-white">← Home</a>
    </div>
    
    <form id="plannerForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Full Name / Organization</label>
        <input type="text" id="name" required class="w-full bg-gray-700 p-3 rounded-lg border border-gray-600 focus:outline-none focus:border-indigo-500 text-white">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full bg-gray-700 p-3 rounded-lg border border-gray-600 focus:outline-none focus:border-indigo-500 text-white">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-700 p-3 rounded-lg border border-gray-600 focus:outline-none focus:border-indigo-500 text-white">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">PayFast Merchant ID (Use 10000100 for testing)</label>
        <input type="text" id="payfastId" placeholder="e.g. 10000100" required class="w-full bg-gray-700 p-3 rounded-lg border border-gray-600 focus:outline-none focus:border-indigo-500 text-white">
        <p class="text-xs text-gray-400 mt-1">95% of every ticket sale is paid directly into this account.</p>
      </div>

      <!-- Google reCAPTCHA Widget -->
      <div class="py-2 flex justify-center">
        <div class="g-recaptcha" data-sitekey="6LfzhAEuAAAAAFX8FbKZtpzm49b2kDLOD4NYdhOb" data-theme="dark"></div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl text-white transition shadow-lg mt-2">Register as Event Planner</button>
    </form>
    
    <div id="status" class="mt-4 text-center text-sm font-semibold p-3 rounded-lg hidden"></div>
  </div>

  <script>
    document.getElementById('plannerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      
      status.classList.remove('hidden');
      
      // Check reCAPTCHA
      const recaptchaResponse = typeof grecaptcha !== 'undefined' ? grecaptcha.getResponse() : null;
      if (!recaptchaResponse) {
        status.innerText = "Please check the reCAPTCHA 'I am not a robot' box.";
        status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-900/50 text-red-300 border border-red-700";
        return;
      }

      status.innerText = "Creating account...";
      status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-gray-700 text-gray-300";
      submitBtn.disabled = true;

      const body = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        payfastMerchantId: document.getElementById('payfastId').value.trim(),
        recaptchaToken: recaptchaResponse
      };

      try {
        const res = await fetch('/api/auth/register-planner', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        
        const data = await res.json();
        submitBtn.disabled = false;
        
        if (data.success) {
          status.innerText = data.message;
          status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-green-900/50 text-green-300 border border-green-700";
          setTimeout(() => {
            window.location.href = '/organizer.html';
          }, 1500);
        } else {
          status.innerText = data.message;
          status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-900/50 text-red-300 border border-red-700";
          if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
        }
      } catch (err) {
        submitBtn.disabled = false;
        status.innerText = "Network / Registration error: " + err.message;
        status.className = "mt-4 text-center text-sm font-semibold p-3 rounded-lg bg-red-900/50 text-red-300 border border-red-700";
        if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
      }
    });
  </script>
</body>
</html>
