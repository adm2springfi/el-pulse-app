<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Registration - EL Pulse Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white">EL Pulse</h1>
            <p class="text-slate-400 text-sm mt-1">Register as Event Organizer</p>
        </div>

        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <form onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Full Name / Organization</label>
                <input type="text" id="name" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">PayFast Merchant ID (Use 10000100 for testing)</label>
                <input type="text" id="payfastMerchantId" placeholder="10000100" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-white outline-none">
                <p class="text-[11px] text-slate-400 mt-1">Ticket payouts go straight to this PayFast merchant account.</p>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition mt-2">
                Register as Event Planner
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Already registered? <a href="/planner-login.html" class="text-indigo-400 hover:underline font-semibold">Sign in here</a>
        </p>
    </div>

    <script>
        function showAlert(msg, isError = true) {
            const box = document.getElementById('alert-box');
            box.className = `mb-6 p-4 rounded-xl text-sm font-medium ${isError ? 'bg-red-900/40 border border-red-500/50 text-red-200' : 'bg-emerald-900/40 border border-emerald-500/50 text-emerald-200'}`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const payfastMerchantId = document.getElementById('payfastMerchantId').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, payfastMerchantId })
                });

                const contentType = res.headers.get('content-type');
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await res.json();
                } else {
                    throw new Error('Server returned invalid response. Please try again.');
                }

                if (!res.ok) throw new Error(data.error || 'Registration failed.');

                showAlert('Account registered successfully! Redirecting...', false);
                setTimeout(() => {
                    window.location.href = '/organizer.html';
                }, 1000);
            } catch (err) {
                showAlert('Registration error: ' + err.message, true);
            }
        }
    </script>
</body>
</html>
